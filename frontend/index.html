<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AgentFlow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23284b9a'/%3E%3Cpath d='M4 11.5 8 4l4 7.5M5.6 9h4.8' fill='none' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E" />
    <script>
      // Aplica el tema guardado antes del primer pintado (evita el parpadeo). Preferencia: claro | oscuro | sistema.
      try {
        var p = localStorage.getItem("agentflow.tema");
        var oscuro = p === "oscuro" || ((p === null || p === "sistema") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = oscuro ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
